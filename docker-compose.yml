# FinIntel V2 Tier 1 Production Infrastructure & Observability Stack
# Services:
#   - postgres:   pgvector/pgvector:pg16 (ducklake_catalog + dagster_state + finintel_rag)
#   - valkey:     Valkey 8 shared L2 response cache across FastAPI serving
#   - prometheus: RED metrics & Valkey cache scraper targeting FastAPI /metrics
#   - tempo:      Grafana Tempo 2.7.2 OTLP trace backend (HTTP :4318 / gRPC :4317 / Query :3200)
#   - grafana:    Grafana 11.5.2 auto-provisioned RED + Trace-to-Metrics dashboard (:3001)
#
# Quick start (M-01 demo config: pin FININTEL_WORKERS=1 with multi-threaded DuckDB
# so Prometheus rate() curves on Grafana stay smooth and monotonic; set
# PROMETHEUS_MULTIPROC_DIR when scaling FININTEL_WORKERS > 1):
#   docker compose up -d
#   $env:FININTEL_VALKEY_URL = "redis://127.0.0.1:6379/0"
#   $env:FININTEL_DUCKLAKE_PG_DSN = "postgresql://finintel:finintel_dev@127.0.0.1:5432/ducklake_catalog"
#   $env:FININTEL_SERVER_ENGINE = "granian"
#   $env:FININTEL_WORKERS = "1"
#   $env:FININTEL_OTEL_ENABLED = "1"
#   $env:OTEL_EXPORTER_OTLP_TRACES_ENDPOINT = "http://127.0.0.1:4318/v1/traces"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FININTEL_PG_USER:-finintel}
      POSTGRES_PASSWORD: ${FININTEL_PG_PASSWORD:-finintel_dev}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${FININTEL_PG_PORT:-5432}:5432"
    volumes:
      - finintel_pg_data:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FININTEL_PG_USER:-finintel} -d dagster_state"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    container_name: finintel-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${FININTEL_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: finintel-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FININTEL_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finintel_prom_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage

  tempo:
    image: grafana/tempo:2.7.2
    container_name: finintel-tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "127.0.0.1:${FININTEL_TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${FININTEL_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${FININTEL_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./config/tempo.yml:/etc/tempo.yaml:ro
      - finintel_tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.5.2
    container_name: finintel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_USER: ${FININTEL_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FININTEL_GRAFANA_PASSWORD:-finintel_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    ports:
      - "127.0.0.1:${FININTEL_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - finintel_grafana_data:/var/lib/grafana

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finintel-dagster-daemon
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      FININTEL_DATA_ROOT: ${FININTEL_CONTAINER_DATA_ROOT:-/app/data}
      FININTEL_PG_USER: ${FININTEL_PG_USER:-finintel}
      FININTEL_PG_PASSWORD: ${FININTEL_PG_PASSWORD:-finintel_dev}
      FININTEL_PG_HOST: postgres
      FININTEL_DAGSTER_PG_DB: dagster_state
      FININTEL_PG_PORT: "5432"
      FININTEL_DUCKLAKE_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-finintel_dev}@postgres:5432/ducklake_catalog
      FININTEL_RAG_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-finintel_dev}@postgres:5432/finintel_rag
      FININTEL_OTEL_ENABLED: ${FININTEL_OTEL_ENABLED:-1}
      OTEL_SERVICE_NAME: finintel-dagster-daemon
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      PROMETHEUS_MULTIPROC_DIR: /app/data/.prom_multiproc
    volumes:
      - ${FININTEL_HOST_DATA_ROOT:-./data}:/app/data
    command:
      - sh
      - -c
      - mkdir -p /app/data/.prom_multiproc && uv run --no-sync python -m finintel.orchestration.resources --universe-tickers-path /app/config/universe_tickers.yaml && exec uv run --no-sync dagster-daemon run -m finintel.orchestration.definitions
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finintel-dagster-webserver
    profiles:
      - dagster-ui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      FININTEL_DATA_ROOT: ${FININTEL_CONTAINER_DATA_ROOT:-/app/data}
      FININTEL_PG_USER: ${FININTEL_PG_USER:-finintel}
      FININTEL_PG_PASSWORD: ${FININTEL_PG_PASSWORD:-finintel_dev}
      FININTEL_PG_HOST: postgres
      FININTEL_DAGSTER_PG_DB: dagster_state
      FININTEL_PG_PORT: "5432"
    ports:
      - "127.0.0.1:${FININTEL_DAGSTER_PORT:-3002}:3000"
    volumes:
      - ${FININTEL_HOST_DATA_ROOT:-./data}:/app/data:ro
    command:
      - uv
      - run
      - --no-sync
      - dagster-webserver
      - --read-only
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -m
      - finintel.orchestration.definitions

volumes:
  finintel_pg_data:
  finintel_prom_data:
  finintel_tempo_data:
  finintel_grafana_data:
