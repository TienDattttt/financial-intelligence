name: CI

on:
  push:
    branches: [main, v2/integration]
  pull_request:
    branches: [main, v2/integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mvp-checks:
    name: MVP Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked MVP dependencies
        run: uv sync --locked --group ml --dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src scripts tests dashboard
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests dashboard
      - name: Check types
        run: uv run --no-sync mypy --strict src/finintel scripts/spike_vnstock6.py scripts/spike_option_b.py tests/unit
      - name: Run tests
        run: uv run --no-sync pytest -q

  platform-checks:
    name: Platform Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Platform dependencies
        run: uv sync --locked --group ml --group platform --dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src scripts tests dashboard
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests dashboard
      - name: Check types
        run: uv run --no-sync mypy --strict src/finintel scripts/spike_vnstock6.py scripts/spike_option_b.py tests/unit
      - name: Run tests
        run: uv run --no-sync pytest -q
