name: CI

on:
  push:
    branches: [main, v2/integration]
  pull_request:
    branches: [main, v2/integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mvp-checks:
    name: MVP Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked MVP dependencies
        run: uv sync --locked --group ml --dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src scripts tests
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests
      - name: Check types
        run: >-
          uv run --no-sync mypy --strict
          src/finintel/__init__.py
          src/finintel/config.py
          src/finintel/exceptions.py
          src/finintel/analytics
          src/finintel/domain
          src/finintel/ingestion
          src/finintel/ml
          src/finintel/normalization
          src/finintel/pipeline
          src/finintel/ports
          src/finintel/quality
          src/finintel/storage
          src/finintel/transform
          scripts/spike_vnstock6.py
          scripts/spike_option_b.py
          tests/unit/test_exceptions.py
          tests/unit/test_layer0_orchestration.py
          tests/unit/test_layer1_ingestion.py
          tests/unit/test_layer2_batch_incremental.py
          tests/unit/test_layer2_normalization.py
          tests/unit/test_layer3_ducklake_storage.py
          tests/unit/test_layer3_storage.py
          tests/unit/test_layer4_analytics.py
          tests/unit/test_layer4_disclosure_enrichment.py
          tests/unit/test_layer4_forensic_and_stress.py
          tests/unit/test_layer4_ml.py
          tests/unit/test_layer4_ml_supervised.py
          tests/unit/test_layer6_quality.py
          tests/unit/test_market_prices_collector.py
          tests/unit/test_option_b_incremental_transform.py
          tests/unit/test_regulatory_events_collector.py
          tests/unit/test_spike_vnstock6.py
          tests/unit/test_ui09b_market_valuation.py
      - name: Run tests
        run: uv run --no-sync pytest -q

  platform-checks:
    name: Platform Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.30"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Platform dependencies
        run: uv sync --locked --group ml --group platform --dev
      - name: Check formatting
        run: uv run --no-sync ruff format --check src scripts tests
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests
      - name: Check types
        run: uv run --no-sync mypy --strict src/finintel scripts/spike_vnstock6.py scripts/spike_option_b.py tests/unit
      - name: Run tests
        run: uv run --no-sync pytest -q

  frontend-checks:
    name: Frontend Next.js (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Node dependencies
        run: npm ci
      - name: Lint, typecheck, and build
        run: npm run check
      - name: Run unit tests
        run: npm run test:unit
