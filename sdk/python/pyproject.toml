[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "finintel-sdk"
version = "0.1.0"
description = "Official Python SDK for the FinIntel Open Research & B2B API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finintel_sdk"]
