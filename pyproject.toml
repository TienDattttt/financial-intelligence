[project]
name = "finintel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "filelock==4.2.10",
    "duckdb==1.4.2",
    "openpyxl==3.1.5",
    "polars==1.35.2",
    "pyarrow==22.0.0",
    "pyyaml==6.0.3",
    "tenacity==9.2.1",
    "vnstock-oapi==0.1.2",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "ruff==0.14.14",
]
ml = [
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "shap==0.49.1",
    "xgboost==3.1.3",
]
spike = [
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.uv.sources]
vnstock-oapi = { index = "vnstock" }

[[tool.uv.index]]
name = "vnstock"
url = "https://vnstocks.com/api/packages"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
target-version = "py311"
