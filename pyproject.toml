[project]
name = "finintel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "filelock==4.2.10",
    "duckdb==1.4.2",
    "openpyxl==3.1.5",
    "polars==1.35.2",
    "pyarrow==22.0.0",
    "pyyaml==6.0.3",
    "tenacity==9.2.1",
    "vnstock-oapi==0.1.2",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "ruff==0.14.14",
]
ml = [
    "numpy==2.2.6",
    "scipy==1.17.1",
    "scikit-learn==1.7.2",
    "shap==0.49.1",
    "xgboost==2.1.4",
]
notebooks = [
    "plotly==6.0.1",
]
spike = [
    "httpx==0.28.1",
]
platform = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "httpx==0.28.1",
    "dagster==1.13.30",
    "dagster-postgres==0.29.30",
    "dagster-webserver==1.13.30",
    "orjson==3.13.0",
    "granian==2.8.8",
    "redis==8.1.0",
    "psycopg[binary]==3.3.9",
    "structlog==26.1.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
]
rag = [
    "pymupdf==2.1",
    "pgvector==0.5.1",
    "google-genai==1.20.0",
    "sentence-transformers==6.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
vnstock-oapi = { index = "vnstock" }

[[tool.uv.index]]
name = "vnstock"
url = "https://vnstocks.com/api/packages"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "src"

[tool.ruff]
target-version = "py311"
