
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "assertive"
  high_level_summary: true

  auto_approvals:
    enabled: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0

  path_instructions:
    - path: "**/*"
      instructions: |
        Review this change as code generated by an AI agent.

        Prioritize functional defects over stylistic suggestions.

        1. CORRECTNESS
        - Find logic bugs and incorrect conditions.
        - Check null, empty, boundary and error cases.
        - Check concurrency, state and async behavior.
        - Identify regressions in related modules.

        2. SPEC COMPLIANCE
        - Read the spec referenced in the PR description.
        - Compare implementation with acceptance criteria.
        - Flag missing, incorrect or extra functionality.
        - If the spec is unavailable, say it is unverified.

        3. AI HALLUCINATIONS
        - Identify nonexistent APIs, functions or exports.
        - Detect incorrect library assumptions.
        - Check external and internal API contracts.
        - Flag invented configuration or data structures.

        4. CODE QUALITY
        - Detect dead, duplicate and unnecessary code.
        - Flag unjustified abstractions and dependencies.
        - Look for unnecessary layers and wrappers.
        - Check compatibility with existing architecture.
        - Explain concrete problems, not style preferences.

        5. SECURITY
        - Check input validation and authorization.
        - Detect injection and sensitive data exposure.
        - Look for insecure error handling.
        - Check trust boundaries and unsafe assumptions.

        6. EVIDENCE
        - Include concrete evidence for significant findings.
        - Explain impact and a minimal fix.
        - Distinguish verified defects from suspected risks.
        - Do not assume passing tests prove correctness.

    - path: "tests/**"
      instructions: |
        Audit test integrity carefully.
        - Detect skipped, disabled or weakened tests.
        - Detect removed or meaningless assertions.
        - Find mocks hiding the actual behavior.
        - Identify missing negative and boundary tests.
        - Flag tests that merely mirror implementation.
        - Check whether tests match the original spec.

    - path: "**/__tests__/**"
      instructions: |
        Look for false positives in test results.
        Flag excessive mocking, weak assertions,
        skipped tests and untested failure paths.
