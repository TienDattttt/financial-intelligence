# FinIntel V3.0 — Free Cloud Production Stack ($0/month, OCI Always Free)
# Target Host: Oracle Cloud (OCI) Always Free Ampere A1 (2 ARM64 OCPUs / 12 GB RAM / 200 GB Disk)
# Hard Memory Budget: 128M + 256M + 2048M + 2048M + 2560M + 512M = 7552M (< 8 GB),
# leaving > 4 GB headroom for Linux OS, page cache, and DuckDB bursts.
#
# Security Invariants:
#   - ONLY Caddy exposes public ports (80/443).
#   - Postgres, Valkey, and dagster-webserver reside strictly inside `internal_net` (internal: true).
#   - `api` and `dagster-daemon` join `internal_net` + `egress_net` (outbound R2/FHSC/Gemini, zero host ports).
#   - Access Dagster UI strictly via SSH tunnel if needed (`ssh -L 3001:127.0.0.1:3001 ...`).

services:
  caddy:
    image: caddy:2-alpine
    container_name: finintel-caddy-free
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FININTEL_API_DOMAIN: ${FININTEL_API_DOMAIN:-api.finintel.local}
    volumes:
      - ./config/gateway/Caddyfile.free:/etc/caddy/Caddyfile:ro
      - finintel_caddy_data:/data
      - finintel_caddy_config:/config
    networks:
      - edge_net
      - internal_net
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: finintel-postgres-free
    restart: unless-stopped
    mem_limit: 2048m
    environment:
      POSTGRES_USER: ${FININTEL_PG_USER:-finintel}
      POSTGRES_PASSWORD: ${FININTEL_PG_PASSWORD:-change_me_in_env}
      POSTGRES_DB: postgres
    volumes:
      - finintel_pg_data:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FININTEL_PG_USER:-finintel} -d ducklake_catalog"]
      interval: 10s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    container_name: finintel-valkey-free
    restart: unless-stopped
    mem_limit: 256m
    command:
      - valkey-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finintel-api-free
    restart: unless-stopped
    mem_limit: 2048m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      FININTEL_DATA_ROOT: /app/data
      FININTEL_STORAGE_BACKEND: ducklake
      FININTEL_DUCKLAKE_CATALOG_DRIVER: postgres
      FININTEL_DUCKLAKE_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-change_me_in_env}@postgres:5432/ducklake_catalog
      FININTEL_RAG_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-change_me_in_env}@postgres:5432/finintel_rag
      FININTEL_VALKEY_URL: redis://valkey:6379/0
      FININTEL_CORS_ORIGINS: ${FININTEL_CORS_ORIGINS:-https://finintel.vercel.app}
      FININTEL_CORS_ALLOW_CREDENTIALS: ${FININTEL_CORS_ALLOW_CREDENTIALS:-1}
      FININTEL_SERVER_ENGINE: granian
      FININTEL_WORKERS: "1"
      FININTEL_DUCKDB_THREADS: ${FININTEL_DUCKDB_THREADS:-2}
      FININTEL_DUCKDB_MEMORY_LIMIT: ${FININTEL_DUCKDB_MEMORY_LIMIT:-1GB}
      FININTEL_OBJECT_STORE_BACKEND: ${FININTEL_OBJECT_STORE_BACKEND:-local}
      FININTEL_OBJECT_STORE_BUCKET: ${FININTEL_OBJECT_STORE_BUCKET:-}
      FININTEL_OBJECT_STORE_PREFIX: ${FININTEL_OBJECT_STORE_PREFIX:-finintel/lakehouse}
      FININTEL_R2_ENDPOINT_URL: ${FININTEL_R2_ENDPOINT_URL:-}
      FININTEL_S3_REGION: ${FININTEL_S3_REGION:-auto}
      FININTEL_S3_ACCESS_KEY_ID: ${FININTEL_S3_ACCESS_KEY_ID:-}
      FININTEL_S3_SECRET_ACCESS_KEY: ${FININTEL_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${FININTEL_HOST_DATA_ROOT:-./data}:/app/data:ro
    networks:
      - internal_net
      - egress_net
    command:
      - uv
      - run
      - --no-sync
      - granian
      - --interface
      - asgi
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - finintel.serving.api:app
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--no-sync",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finintel-dagster-daemon-free
    restart: unless-stopped
    mem_limit: 2560m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      FININTEL_DATA_ROOT: /app/data
      FININTEL_PG_USER: ${FININTEL_PG_USER:-finintel}
      FININTEL_PG_PASSWORD: ${FININTEL_PG_PASSWORD:-change_me_in_env}
      FININTEL_PG_HOST: postgres
      FININTEL_DAGSTER_PG_DB: dagster_state
      FININTEL_PG_PORT: "5432"
      FININTEL_DUCKLAKE_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-change_me_in_env}@postgres:5432/ducklake_catalog
      FININTEL_RAG_PG_DSN: postgresql://${FININTEL_PG_USER:-finintel}:${FININTEL_PG_PASSWORD:-change_me_in_env}@postgres:5432/finintel_rag
      FININTEL_OBJECT_STORE_BACKEND: ${FININTEL_OBJECT_STORE_BACKEND:-local}
      FININTEL_OBJECT_STORE_BUCKET: ${FININTEL_OBJECT_STORE_BUCKET:-}
      FININTEL_R2_ENDPOINT_URL: ${FININTEL_R2_ENDPOINT_URL:-}
      FININTEL_S3_REGION: ${FININTEL_S3_REGION:-auto}
      FININTEL_S3_ACCESS_KEY_ID: ${FININTEL_S3_ACCESS_KEY_ID:-}
      FININTEL_S3_SECRET_ACCESS_KEY: ${FININTEL_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ${FININTEL_HOST_DATA_ROOT:-./data}:/app/data
    networks:
      - internal_net
      - egress_net
    command:
      - sh
      - -c
      - uv run --no-sync python -m finintel.orchestration.resources --universe-tickers-path /app/config/universe_tickers.yaml && exec uv run --no-sync dagster-daemon run -m finintel.orchestration.definitions
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finintel-dagster-webserver-free
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /app/dagster_home
      FININTEL_DATA_ROOT: /app/data
      FININTEL_PG_USER: ${FININTEL_PG_USER:-finintel}
      FININTEL_PG_PASSWORD: ${FININTEL_PG_PASSWORD:-change_me_in_env}
      FININTEL_PG_HOST: postgres
      FININTEL_DAGSTER_PG_DB: dagster_state
      FININTEL_PG_PORT: "5432"
    volumes:
      - ${FININTEL_HOST_DATA_ROOT:-./data}:/app/data:ro
    networks:
      - internal_net
    command:
      - uv
      - run
      - --no-sync
      - dagster-webserver
      - --read-only
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -m
      - finintel.orchestration.definitions

networks:
  edge_net:
    driver: bridge
  egress_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  finintel_pg_data:
  finintel_caddy_data:
  finintel_caddy_config:
