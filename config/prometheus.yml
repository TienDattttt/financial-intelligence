global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "finintel_serving_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "finintel-api"
          tier: "tier1"

  - job_name: "finintel_tempo"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: "finintel-tempo"
          tier: "observability"
