state_path: ../data/metadata/state.sqlite
min_free_bytes: 104857600
tickers: []
storage:
  backend: ducklake
  catalog:
    driver: sqlite
    sqlite_path: ../data/metadata/ducklake_catalog.sqlite
    postgres_dsn_env: FININTEL_DUCKLAKE_PG_DSN
  data_path: ../data/lakehouse/data
  catalog_alias: finintel_lake
  retention:
    keep_snapshots: 2
    min_snapshot_age_seconds: 3600
    curated_keep_runs: 2
  publish_unmapped: false
ingestion: {}
serving:
  cors_origins: []
  ducklake_pg_dsn_env: FININTEL_DUCKLAKE_PG_DSN
  valkey_url_env: FININTEL_VALKEY_URL
orchestration:
  data_root_env: FININTEL_DATA_ROOT
  disclosure_fetch_online_env: FININTEL_DISCLOSURE_FETCH_ONLINE
  universe_tickers_path: universe_tickers.yaml
  max_partitions_per_run: 5
  year_round_watermark_sweep: true
  timezone: Asia/Ho_Chi_Minh
  ml_artifact_dir: ../data/metadata/ml_models
  ml_retrain_cron: "0 2 1 1,4,7,10 *"
  # Runbook (shared FININTEL_DATA_ROOT between Dagster & FastAPI):
  #   set FININTEL_DATA_ROOT=data
  #   DAGSTER_HOME=config uv run dagster dev -h 127.0.0.1 -p 3000 -m finintel.orchestration.definitions
# Supply the reviewed issuer reference table at data/curated/issuers.parquet
# or configure issuers_path below. The default facts input is the latest
# successful full-history normalization for the requested source, with
# data/curated/financial_facts.parquet as a compatibility fallback.
# An explicit facts_path must point to a complete normalized history.
# Analytics records the actual as_of in _analytics_meta.json for replay.
# analytics:
#   facts_path: ../data/curated/financial_facts.parquet
#   issuers_path: ../data/curated/issuers.parquet
#   as_of: "YYYY-MM-DD"  # Replay cutoff. Omit to use the run date.
